<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 | Lazy Loading</title>
    <meta name="description" content="Practice of lazy loading by displaying images in a column.">
    <meta name="author" content="Makay Raddatz">
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>

<body>
    <main>
        <h1>Lazy Loading</h1>
        <div>
            <img src="images/duckies2.webp" loading="lazy" width="400px" height="600px">
            <img src="images/dog.webp" loading="lazy" width="400px" height="600px">
            <img src="images/bubbles.webp" loading="lazy" width="400px" height="600px">
            <img src="images/autumn-leaves.webp" loading="lazy" width="400px" height="600px">
            <img src="images/hurricane.webp" loading="lazy" width="400px" height="600px">
            <img src="images/earth.webp" loading="lazy" width="400px" height="600px">
        </div>
    </main>
    <footer>
        <p>Makay Raddatz | Lazy Loading</p>
        <p>Last Modificaiton: <span id="lazy"></span></p>
    </footer>

</body>

</html>
